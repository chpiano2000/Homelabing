---
- name: Preinstall
  hosts: k3s_cluster
  roles:
    - pre_install

- name: Create k3s server
  hosts: k3s_masters
  roles:
    - k3s_server

- name: Create k3s agents
  hosts: k3s_agents
  roles:
    - k3s_agent

- name: Create k3s agents
  hosts: k3s_cluster
  roles:
    - automatic_upgrade

- name: Apply cilium cni
  hosts: k3s_masters
  run_once: true
  tags: cilium
  roles:
    - cilium
