cilium_repo_url: https://helm.cilium.io/
cilium_version: 1.20.0
cilium_namespace: kube-system

cilium_manifests_dir: /tmp/cilium-manifests

gateway_api_version: v1.6.1
gateway_api_crd_urls:
  - "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/{{ gateway_api_version }}/config/crd/standard/gateway.networking.k8s.io_gatewayclasses.yaml"
  - "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/{{ gateway_api_version }}/config/crd/standard/gateway.networking.k8s.io_gateways.yaml"
  - "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/{{ gateway_api_version }}/config/crd/standard/gateway.networking.k8s.io_httproutes.yaml"
  - "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/{{ gateway_api_version }}/config/crd/standard/gateway.networking.k8s.io_referencegrants.yaml"
  - "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/{{ gateway_api_version }}/config/crd/standard/gateway.networking.k8s.io_grpcroutes.yaml"
  - "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/{{ gateway_api_version }}/config/crd/standard/gateway.networking.k8s.io_backendtlspolicies.yaml"
  - "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/{{ gateway_api_version }}/config/crd/standard/gateway.networking.k8s.io_tlsroutes.yaml"

cilium_values:
  ipam:
    mode: kubernetes
  kubeProxyReplacement: true
  bpf:
    masquerade: true
  enableIPv4Masquerade: true
  l2announcements:
    enabled: true
  externalIPs:
    enabled: true
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE
  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup
  k8sServiceHost: "{{ control_plane_endpoint }}"
  k8sServicePort: 6443
  gatewayAPI:
    enabled: true
    enableAlpn: true
    enableAppProtocol: true
  ingressController:
    enabled: true
    loadbalancerMode: dedicated
