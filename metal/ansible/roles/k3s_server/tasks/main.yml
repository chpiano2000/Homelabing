- name: Get installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Set installed k3s version fact
  when: k3s_installed.rc == 0
  ansible.builtin.set_fact:
    k3s_installed_version: "{{ k3s_installed.stdout_lines[0].split(' ')[2] }}"

- name: Download k3s binary
  ansible.builtin.get_url:
    url: https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s
    checksum: sha256:https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/sha256sum-amd64.txt
    dest: "{{ role_path }}/files/bin/k3s"
    mode: 0755
  delegate_to: localhost
  run_once: true

- name: Copy k3s binary to nodes
  when: k3s_installed.rc != 0 or k3s_installed_version is version(k3s_version, '<')
  ansible.builtin.copy:
    src: bin/k3s
    dest: /usr/local/bin/k3s
    owner: root
    group: root
    mode: 0755
  register: k3s_binary_copy

- name: Ensure config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: 0755
  loop:
    - /etc/rancher/k3s
    - /etc/rancher/node
    - "{{ k3s_data_dir }}/agent/pod-manifests"

- name: Check if k3s token file exists on the first master
  run_once: true
  delegate_to: "{{ groups['k3s_masters'][0] }}"
  ansible.builtin.stat:
    path: "{{ k3s_token_file }}"
  register: k3s_token_file_stat

- name: Generate k3s token on the first master if not exist yet
  run_once: true
  delegate_to: "{{ groups['k3s_masters'][0] }}"
  when: not k3s_token_file_stat.stat.exists
  ansible.builtin.copy:
    content: "{{ lookup('community.general.random_string', length=32) }}"
    dest: "{{ k3s_token_file }}"
    mode: 0600

- name: Read k3s token from the first master
  run_once: true
  delegate_to: "{{ groups['k3s_masters'][0] }}"
  ansible.builtin.slurp:
    src: "{{ k3s_token_file }}"
  register: k3s_token_base64

- name: Ensure all nodes have the same token
  ansible.builtin.copy:
    content: "{{ k3s_token_base64.content | b64decode }}"
    dest: "{{ k3s_token_file }}"
    mode: 0600

- name: Render k3s config files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: 0644
  loop:
    - src: config.yaml.j2
      dest: "{{ k3s_config_file }}"
    - src: k3s.service.j2
      dest: "{{ k3s_service_file }}"
  register: k3s_config_render

- name: Gather service facts
  ansible.builtin.service_facts:

# Bring up the first master alone so `cluster-init` creates the etcd cluster
# before any other server tries to join. If the service is already running and
# the binary or config just changed, restart to pick up the new version;
# otherwise a plain `started` is a no-op or a fresh start with the new config.
- name: Ensure k3s is running on the first master
  when: inventory_hostname == groups['k3s_masters'][0]
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: "{{ 'restarted' if (k3s_binary_copy.changed or k3s_config_render.changed) and (ansible_facts.services['k3s.service'] is defined and ansible_facts.services['k3s.service'].state == 'running') else 'started' }}"
    daemon_reload: true
  register: k3s_first_master_service
  until: k3s_first_master_service is succeeded
  retries: 5

- name: Wait for k3s API on the control plane endpoint
  run_once: true
  delegate_to: "{{ groups['k3s_masters'][0] }}"
  ansible.builtin.wait_for:
    host: "{{ control_plane_endpoint }}"
    port: 6443
    timeout: 120

# NOTE: On a multi-master cluster, run the playbook with `--forks=1` so joiners
# restart one at a time and etcd quorum is preserved.
- name: Ensure k3s is running on joining nodes
  when: inventory_hostname != groups['k3s_masters'][0]
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: "{{ 'restarted' if (k3s_binary_copy.changed or k3s_config_render.changed) and (ansible_facts.services['k3s.service'] is defined and ansible_facts.services['k3s.service'].state == 'running') else 'started' }}"
    daemon_reload: true
  register: k3s_joiner_service
  until: k3s_joiner_service is succeeded
  retries: 5

- name: Verify all masters joined the control plane
  run_once: true
  delegate_to: "{{ groups['k3s_masters'][0] }}"
  when: (groups['k3s_masters'] | length) > 1
  ansible.builtin.command:
    cmd: >-
      k3s kubectl get nodes
      -l node-role.kubernetes.io/control-plane=true
      -o jsonpath={.items[*].metadata.name}
  register: k3s_control_plane_nodes
  until:
    - k3s_control_plane_nodes.rc == 0
    - (k3s_control_plane_nodes.stdout.split() | length) == (groups['k3s_masters'] | length)
  retries: 20
  delay: 10
  changed_when: false

- name: Get Kubernetes config file
  run_once: true
  delegate_to: "{{ groups['k3s_masters'][0] }}"
  ansible.builtin.slurp:
    src: "{{ k3s_kubeconfig_file }}"
  register: kubeconfig_base64

- name: Write Kubernetes config file with the correct cluster address
  ansible.builtin.copy:
    content: "{{ kubeconfig_base64.content | b64decode | replace('127.0.0.1', control_plane_endpoint) }}"
    dest: "{{ playbook_dir }}/kubeconfig.yaml"
    mode: 0600
  delegate_to: localhost
  run_once: true
