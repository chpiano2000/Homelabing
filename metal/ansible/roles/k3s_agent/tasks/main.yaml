- name: Get installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Set installed k3s version fact
  when: k3s_installed.rc == 0
  ansible.builtin.set_fact:
    k3s_installed_version: "{{ k3s_installed.stdout_lines[0].split(' ')[2] }}"

- name: Download k3s binary
  ansible.builtin.get_url:
    url: https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s
    checksum: sha256:https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/sha256sum-amd64.txt
    dest: "{{ role_path }}/files/bin/k3s"
    mode: 0755
  delegate_to: localhost
  run_once: true

- name: Copy k3s binary to nodes
  when: k3s_installed.rc != 0 or k3s_installed_version is version(k3s_version, '<')
  ansible.builtin.copy:
    src: bin/k3s
    dest: /usr/local/bin/k3s
    owner: root
    group: root
    mode: 0755
  register: k3s_binary_copy

- name: Ensure config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: 0755
  loop:
    - /etc/rancher/k3s
    - /etc/rancher/node
    - "{{ k3s_data_dir }}/agent/pod-manifests"

- name: Read k3s token from the master
  run_once: true
  delegate_to: "{{ groups['k3s_masters'][0] }}"
  ansible.builtin.slurp:
    src: "{{ k3s_token_file }}"
  register: k3s_token_base64

- name: Distribute k3s token to agent nodes
  ansible.builtin.copy:
    content: "{{ k3s_token_base64.content | b64decode }}"
    dest: "{{ k3s_token_file }}"
    mode: 0600

- name: Render k3s-agent config files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: 0644
  loop:
    - src: config.yaml.j2
      dest: "{{ k3s_config_file }}"
    - src: k3s-agent.service.j2
      dest: "{{ k3s_agent_service_file }}"
  register: k3s_agent_config_render

- name: Wait for control plane API to be reachable
  ansible.builtin.wait_for:
    host: "{{ control_plane_endpoint }}"
    port: 6443
    timeout: 120

- name: Gather service facts
  ansible.builtin.service_facts:

# Restart only if the service is already running and picked up a stale binary
# or config; on a fresh start, `started` brings k3s-agent up with the new files.
- name: Ensure k3s-agent is running
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: "{{ 'restarted' if (k3s_binary_copy.changed or k3s_agent_config_render.changed) and (ansible_facts.services['k3s-agent.service'] is defined and ansible_facts.services['k3s-agent.service'].state == 'running') else 'started' }}"
    daemon_reload: true
  register: k3s_agent_service
  until: k3s_agent_service is succeeded
  retries: 5
