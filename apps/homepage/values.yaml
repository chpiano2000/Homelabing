app-template:
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/gethomepage/homepage
            tag: v1.13.2
          env:
            HOMEPAGE_ALLOWED_HOSTS: home.daxvo.tech
  service:
    main:
      ports:
        http:
          port: 3000
          protocol: HTTP
  route:
    main:
      enabled: true
      hostnames:
        - home.daxvo.tech
      parentRefs:
        - name: public-gateway
          namespace: gateway-system
          sectionName: http
        - name: public-gateway
          namespace: gateway-system
          sectionName: https
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: homepage
              port: 3000
  persistence:
    config:
      enabled: true
      type: configMap
      identifier: config
      globalMounts:
        - path: /app/config/settings.yaml
          subPath: settings.yaml
        - path: /app/config/widgets.yaml
          subPath: widgets.yaml
        - path: /app/config/services.yaml
          subPath: services.yaml
        - path: /app/config/bookmarks.yaml
          subPath: bookmarks.yaml
        - path: /app/config/custom.css
          subPath: custom.css
  configMaps:
    config:
      enabled: true
      data:
        settings.yaml: |
          title: Homelabing
          background:
            image: https://images.unsplash.com/photo-1504805572947-34fad45aed93?q=80&w=2607&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D
            blur: md
            brightness: 55
          cardBlur: sm
          theme: dark
          headerStyle: boxed
          hideVersion: true
          color: slate
        widgets.yaml: |
          - search:
              provider: google
              target: _blank
        services.yaml: |
          - Development:
            - ArgoCD:
                href: https://argocd.daxvo.tech
                description: Continuous deployment
                icon: https://icon.icepanel.io/Technology/svg/Argo-CD.svg
        bookmarks.yaml: |
          - Homelab:
            - Repository:
              - href: https://github.com/chpiano2000/Homelabing
                icon: github.svg
          - Managed services:
            - Cloudflare:
              - href: https://dash.cloudflare.com
                icon: cloudflare.svg
          - Infrastructure:
            - Proxmox:
              - href: https://10.0.0.50:8006
                icon: proxmox.svg
            - Oracle Cloud:
              - href: https://cloud.oracle.com
                icon: oracle-cloud.svg
        custom.css: |
          @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

          :root {
            --font-main: "Space Grotesk", "Neue Montreal", -apple-system, BlinkMacSystemFont, sans-serif;
          }

          html, body {
            font-family: var(--font-main) !important;
            font-size: 0.85rem;
            line-height: 1.8;
            text-transform: uppercase;
          }

          #information-widgets .header-title,
          .information-widget-title {
            font-family: var(--font-main);
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: -1.5px;
          }

          .services-group h2,
          .bookmarks-group h2 {
            font-family: var(--font-main);
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: -1px;
          }

          .service-name,
          .bookmark-text a {
            font-family: var(--font-main);
            font-size: 0.9rem;
            font-weight: 500;
          }

          .service-description,
          .bookmark-description {
            font-family: var(--font-main);
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.85;
            text-transform: none;
          }

