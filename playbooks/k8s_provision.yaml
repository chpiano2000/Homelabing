---
- name: Provision Infrastructure
  hosts: all
  connection: local
  gather_facts: false
  serial: 1 # don't know why running in parallel costs deadlock

  tasks:
    - name: Authenticate to Promox
      ansible.builtin.include_role:
        name: metal.promox.promox_auth

    - name: Provision VMs
      ansible.builtin.include_role:
        name: metal.promox.provision_vms

    - name: Get VM Ids
      ansible.builtin.include_role:
        name: metal.promox.get_vms

    - name: Setup VMs
      ansible.builtin.include_role:
        name: metal.promox.setup_mac

    - name: Start VMs
      ansible.builtin.include_role:
        name: metal.promox.start_vms

- name: Install Talos
  hosts: all
  connection: local
  gather_facts: false
  tasks:
    - name: Bootstrap Talos Cluster
      ansible.builtin.include_role:
        name: metal.talos.bootstrap
      run_once: true

    - name: Install CNI
      ansible.builtin.include_role:
        name: metal.talos.cni
      run_once: true

    - name: Join Agents To Cluster
      ansible.builtin.include_role:
        name: metal.talos.agents
      run_once: true