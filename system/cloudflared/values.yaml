app-template:
  controllers:
    cloudflared:
      replicas: 2
      containers:
        app:
          image:
            repository: docker.io/cloudflare/cloudflared
            tag: latest
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yaml
            - run
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 2000
                initialDelaySeconds: 10
                periodSeconds: 10
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /ready
                  port: 2000
                initialDelaySeconds: 5
                periodSeconds: 5
  configMaps:
    config:
      enabled: true
      data:
        config.yaml: |
          tunnel: homelab
          credentials-file: /etc/cloudflared/credentials.json
          metrics: 0.0.0.0:2000
          no-autoupdate: true
          ingress:
            - hostname: "*.daxvo.tech"
              service: https://cilium-gateway-public-gateway.gateway-system.svc.cluster.local
              originRequest:
                noTLSVerify: true
            - service: http_status:404
  persistence:
    config:
      enabled: true
      type: configMap
      name: cloudflared-config
      globalMounts:
        - path: /etc/cloudflared/config.yaml
          subPath: config.yaml
    credentials:
      enabled: true
      type: secret
      # Created by ../../external/cloudflared
      name: cloudflared-credentials
      globalMounts:
        - path: /etc/cloudflared/credentials.json
          subPath: credentials.json
