{{- range .Values.gateways }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  {{- if and .public .externalDNSTarget }}
  annotations:
    external-dns.alpha.kubernetes.io/target: {{ .externalDNSTarget | quote }}
  {{- end }}
spec:
  gatewayClassName: {{ $.Values.gatewayClassName }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

    {{- if $.Values.tls.enabled }}
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $.Values.tls.secretName }}
      allowedRoutes:
        namespaces:
          from: All
    {{- end }}
{{- end }}
