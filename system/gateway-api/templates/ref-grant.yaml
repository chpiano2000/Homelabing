apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-routes
  namespace: {{ .Values.namespace }}
spec:
  from:
    {{- range .Values.gateway.allowedRouteNamespaces }}
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ . }}
    {{- end }}
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway

