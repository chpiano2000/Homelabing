{{- range .Values.gateways }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-routes-to-{{ .name }}
  namespace: {{ $.Values.namespace }}
spec:
  from:
    {{- range .allowedRouteNamespaces }}
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ . }}
    {{- end }}
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .name }}
{{- end }}
