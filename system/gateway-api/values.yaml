domain: daxvo.tech
namespace: gateway-system

gateway:
  name: shared-gateway
  gatewayClassName: cilium
  tls:
    enabled: true
    secretName: letsencrypt-prod
    certName: shared-gateway-tls
  allowedRouteNamespaces:   # ReferenceGrant
    - apps
    - argocd
    - homepage

networkPolicy:
  name: gateway-wireguard-only
  allowedCIDRs:
    - 10.10.0.0/10   # WireGuard
    - 10.42.0.0/16   # cluster pod CIDR (so cloudflared can reach the gateway)

certificate:
  issuer:
    name: prod-issuer
    kind: ClusterOriginIssuer
    group: cert-manager.k8s.cloudflare.com
