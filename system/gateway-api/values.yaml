domain: daxvo.tech
namespace: gateway-system

gatewayClassName: cilium

tls:
  enabled: true
  secretName: letsencrypt-prod
  certName: shared-gateway-tls

gateways:
  - name: internal-gateway
    public: false
    allowedCIDRs:
      - 10.10.0.0/10    # wireguard
    allowedRouteNamespaces:
      - argocd
  - name: public-gateway
    public: true
    allowedRouteNamespaces:
      - apps

certificate:
  issuer:
    name: prod-issuer
    kind: ClusterOriginIssuer
    group: cert-manager.k8s.cloudflare.com
