external-dns:
  provider: cloudflare
  policy: sync
  txtOwnerId: homelab
  sources:
    - gateway-httproute
  env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-token
          key: value
  extraArgs:
    - --annotation-filter=external-dns.alpha.kubernetes.io/exclude notin (true)
    - --cloudflare-proxied
  interval: 5m
  triggerLoopOnEvent: true
  serviceMonitor:
    enabled: false
