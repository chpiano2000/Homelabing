---
- name: Ensure Talos config directory exists
  ansible.builtin.file:
    path: "{{ talos_config_dir }}"
    state: directory
    mode: '0755'

- name: Generate Talos Configuration
  ansible.builtin.command:
    cmd: >
      talosctl gen config {{ cluster_name }} https://{{ hostvars[groups['masters'][0]].ansible_host }}:6443
      --output-dir {{ talos_config_dir }}
      --install-image {{ talos_install_image }}
      --config-patch @{{ role_path }}/files/cluster.yaml
      --config-patch-worker @{{ role_path }}/files/worker.yaml
      --force
  delegate_to: localhost

- name: Apply Control Plane Configuration
  ansible.builtin.command:
    cmd: >
      talosctl apply-config --insecure 
      --nodes {{ hostvars[item].ansible_host }}
      --file {{ talos_config_dir }}/controlplane.yaml
  loop: "{{ groups['masters'] }}"
  delegate_to: localhost

- name: Configure local talosctl endpoint
  ansible.builtin.command:
    cmd: >
      talosctl config endpoint {{ hostvars[groups['masters'][0]].ansible_host }}
      --talosconfig {{ talos_config_file }}
  delegate_to: localhost

- name: Configure local talosctl node
  ansible.builtin.command:
    cmd: >
      talosctl config node {{ hostvars[groups['masters'][0]].ansible_host }}
      --talosconfig {{ talos_config_file }}
  delegate_to: localhost

- name: Bootstrap the Cluster
  ansible.builtin.command:
    cmd: >
      talosctl bootstrap --talosconfig {{ talos_config_file }}
  delegate_to: localhost
  register: bootstrap_result
  retries: 20
  delay: 10
  until: bootstrap_result.rc == 0 or "already bootstrapped" in bootstrap_result.stderr
  failed_when:
    - bootstrap_result.rc != 0
    - "'already bootstrapped' not in bootstrap_result.stderr"

- name: Retrieve Kubeconfig
  ansible.builtin.command:
    cmd: "talosctl kubeconfig {{ talos_config_dir }} --talosconfig {{ talos_config_file }}"
  delegate_to: localhost

- name: Ensure .kube directory exists
  ansible.builtin.file:
    path: "{{ kube_dir }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    state: directory
    mode: '0755'

- name: Ensure .kube/config file exists
  ansible.builtin.file:
    path: "{{ kube_dir }}/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    state: touch
    mode: '0600'
    modification_time: preserve
    access_time: preserve

- name: Set owner and group for a file
  ansible.builtin.file:
    path: "{{ talos_config_dir }}/kubeconfig"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Merge Kubeconfig to default location
  ansible.builtin.copy:
    src: "{{ talos_config_dir }}/kubeconfig"
    dest: "{{ kube_dir }}/config"
    mode: '0600'
