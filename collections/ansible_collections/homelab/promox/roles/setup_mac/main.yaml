- name: Update VM MAC addresses via API
  uri:
    url: "https://{{ pve_api_host }}:{{ pve_api_port }}/{{ pve_api_path }}/nodes/{{ pve_api_node }}/qemu/{{ current_vmid }}/config"
    method: PUT
    headers:
      Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
      CSRFPreventionToken: "{{ proxmox_csrf_token }}"
    body_format: form-urlencoded
    body:
      net0: "virtio={{ mac_address }},bridge=vmbr0"
    validate_certs: no
    status_code: 200
